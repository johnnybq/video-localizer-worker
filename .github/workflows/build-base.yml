name: Build Base Image

# Manual trigger only — run when dependencies change
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base image version tag (e.g., v1, v2)'
        required: true
        default: 'v1'
      push_latest:
        description: 'Also tag as latest?'
        required: true
        type: boolean
        default: true

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Base image build can take up to 60+ min

    steps:
      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h
          # Remove large unused tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          # Clean docker
          sudo docker system prune -af
          sudo docker builder prune -af
          # Add swap for extra memory during large installs
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          echo "After cleanup:"
          df -h
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            johnnybq/video-localizer-base:${{ github.event.inputs.version }}
            ${{ github.event.inputs.push_latest == 'true' && 'johnnybq/video-localizer-base:latest' || '' }}
          # Use Docker Hub registry as cache — layers pushed immediately, saves disk space
          cache-from: type=registry,ref=johnnybq/video-localizer-base:buildcache
          cache-to: type=registry,ref=johnnybq/video-localizer-base:buildcache,mode=max

      - name: Verify base image
        run: |
          echo "Base image pushed successfully!"
          echo "Tags:"
          echo "  - johnnybq/video-localizer-base:${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.push_latest }}" == "true" ]; then
            echo "  - johnnybq/video-localizer-base:latest"
          fi
          echo ""
          echo "Next steps:"
          echo "  1. Final image builds will now use this base"
          echo "  2. Push any change to main to trigger fast rebuild"
